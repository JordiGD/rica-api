<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RICA | Estado</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            color: #17324d;
            background: #eef5f4;
        }

        body {
            display: grid;
            min-height: 100vh;
            place-items: center;
            margin: 0;
        }

        main {
            width: min(90%, 30rem);
            padding: 2.5rem;
            border: 1px solid #c7dcd8;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 1rem 2rem rgba(23, 50, 77, 0.1);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #0b756e;
        }

        #status {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main>
        <h1>RICA</h1>
        <p>Red de Investigacion y Colaboracion Academica</p>
        <p id="status">Comprobando estado...</p>
    </main>
    <script>
        fetch('/api/status')
            .then(response => {
                if (!response.ok) {
                    throw new Error('No se pudo consultar el estado');
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('status').textContent =
                    `${data.proyecto}: ${data.estado}`;
            })
            .catch(error => {
                document.getElementById('status').textContent = error.message;
            });
    </script>
</body>
</html>
