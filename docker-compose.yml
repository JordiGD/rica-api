services:
  rica-db:
    image: postgres:16
    container_name: rica-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rica
      POSTGRES_PASSWORD: rica
      POSTGRES_DB: rica
    ports:
      - "5432:5432"
    volumes:
      - rica-db-data:/var/lib/postgresql/data 

volumes:
  rica-db-data: